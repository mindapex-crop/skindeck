<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- macOS template tray icon: black silhouette + transparent -->
  <!-- Left ear -->
  <path d="M3 5 L6 1 L8 6 Z" fill="#000"/>
  <!-- Right ear -->
  <path d="M14 6 L16 1 L19 5 Z" fill="#000"/>
  <!-- Head -->
  <ellipse cx="11" cy="11" rx="8" ry="8" fill="#000"/>
  <!-- Inner left ear -->
  <path d="M4.5 5 L6 2.5 L7.2 5.5 Z" fill="#fff"/>
  <!-- Inner right ear -->
  <path d="M14.8 5.5 L16 2.5 L17.5 5 Z" fill="#fff"/>
  <!-- White face / muzzle area -->
  <ellipse cx="11" cy="13" rx="5.5" ry="4.5" fill="#fff"/>
  <!-- Left eye -->
  <ellipse cx="8" cy="10.5" rx="1.5" ry="1.8" fill="#000"/>
  <!-- Right eye -->
  <ellipse cx="14" cy="10.5" rx="1.5" ry="1.8" fill="#000"/>
  <!-- Eye highlights -->
  <circle cx="8.6" cy="9.8" r="0.5" fill="#fff"/>
  <circle cx="14.6" cy="9.8" r="0.5" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="11" cy="13" rx="1.2" ry="0.8" fill="#000"/>
  <!-- Mouth -->
  <path d="M11 13.8 Q9.5 15.2 8 14.5" stroke="#000" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  <path d="M11 13.8 Q12.5 15.2 14 14.5" stroke="#000" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="3" y1="12" x2="7.5" y2="12.5" stroke="#000" stroke-width="0.4"/>
  <line x1="3" y1="13.5" x2="7.5" y2="13.5" stroke="#000" stroke-width="0.4"/>
  <line x1="14.5" y1="12.5" x2="19" y2="12" stroke="#000" stroke-width="0.4"/>
  <line x1="14.5" y1="13.5" x2="19" y2="13.5" stroke="#000" stroke-width="0.4"/>
</svg>
