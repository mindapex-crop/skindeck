<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00b8ff"/>
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#b800ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="100" cy="125" rx="65" ry="55" fill="url(#furGrad)"/>

  <polygon points="40,60 30,20 70,55" fill="url(#furGrad)"/>
  <polygon points="160,60 170,20 130,55" fill="url(#furGrad)"/>
  <polygon points="45,55 38,30 63,52" fill="url(#neonMagenta)" opacity="0.8"/>
  <polygon points="155,55 162,30 137,52" fill="url(#neonMagenta)" opacity="0.8"/>

  <ellipse cx="72" cy="100" rx="10" ry="12" fill="url(#neonCyan)" filter="url(#glow)"/>
  <ellipse cx="128" cy="100" rx="10" ry="12" fill="url(#neonCyan)" filter="url(#glow)"/>
  <rect x="69" y="96" width="3" height="6" fill="#fff" opacity="0.9"/>
  <rect x="125" y="96" width="3" height="6" fill="#fff" opacity="0.9"/>

  <path d="M 85 120 L 100 128 L 115 120" stroke="url(#neonCyan)" stroke-width="2" fill="none" filter="url(#glow)"/>
  <circle cx="100" cy="115" r="4" fill="url(#neonMagenta)" filter="url(#glow)"/>

  <line x1="55" y1="115" x2="30" y2="110" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="55" y1="125" x2="30" y2="128" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="145" y1="115" x2="170" y2="110" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="145" y1="125" x2="170" y2="128" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#glow)"/>

  <circle cx="100" cy="145" r="3" fill="url(#neonMagenta)" filter="url(#glow)"/>
  <circle cx="80" cy="135" r="2" fill="url(#neonCyan)" filter="url(#glow)"/>
  <circle cx="120" cy="135" r="2" fill="url(#neonCyan)" filter="url(#glow)"/>
</svg>
